[project]
name = "arca-portal"
version = "0.1.0"
description = "Backend do portal Arca (FastAPI + MariaDB)"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "pymysql==1.2.3"]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["teste_*.py"]
python_functions = ["teste_*"]
pythonpath = ["."]
