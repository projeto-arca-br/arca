<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Arca - Mapas</title>
<link rel="icon" href="/imagens/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/imagens/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/imagens/icone-192.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/mapas/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/mapas/mapas.css">
<script src="/js/common.js"></script>
<script src="/mapas/vendor/pmtiles.js"></script>
<script src="/mapas/vendor/basemaps.js"></script>
<script type="module" src="/mapas/mapas.js"></script>
</head>
<body class="mapas-page">
<header class="topo">
  <a class="marca" href="/"><img class="logo-claro" src="/imagens/logo.svg" alt="Arca" width="122" height="40"><img class="logo-escuro" src="/imagens/logo-escuro.svg" alt="" width="122" height="40"></a>
  <nav class="principal" aria-label="Principal">
    <a href="/">Painel</a>
    <a href="/ajuda/#mapas">Ajuda</a>
    <button type="button" class="botao" id="alternar-tema" aria-label="Alternar tema"></button>
  </nav>
</header>
<main class="miolo mapas-miolo">
  <h1>Mapas</h1>
  <div class="barra">
    <label class="campo">Arquivo de mapa
      <select id="arquivo-mapa" disabled></select>
    </label>
    <form id="form-busca" class="busca" role="search" autocomplete="off">
      <label class="campo">Buscar lugar pelo nome (na área carregada)
        <input id="busca-texto" type="text" placeholder="Ex.: Praça, Centro, Avenida...">
      </label>
      <button class="botao primario" type="submit">Buscar</button>
    </form>
  </div>
  <ul id="resultados" class="lista resultados" hidden></ul>
  <p id="mensagem" class="mensagem" role="status"></p>
  <div id="vazio" class="estado-vazio" hidden>
    <p><strong>Nenhum mapa instalado.</strong></p>
    <p>Coloque um arquivo <code>.pmtiles</code> na pasta <code>data/maps</code> e recarregue esta página. Veja a <a href="/ajuda/#mapas">Ajuda</a>.</p>
  </div>
  <div id="mapa" class="mapa" role="application" aria-label="Mapa interativo"></div>
  <footer>Dados do mapa: &copy; colaboradores do OpenStreetMap, servidos localmente.</footer>
</main>
</body>
</html>
